<!doctype html>
<html lang="en">
<head>
  <!-- Shell document: styling and scripting are inlined for offline use -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
  <title>DayZ-ServerMan</title>
  <!-- INLINE_STYLES -->
</head>
<body data-shell-ready="false">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-shell">
    <!-- Sidebar: brand, server block, navigation, and status -->
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span><strong>DayZ-ServerMan</strong><small>Operator console</small></span>
      </div>
      <!-- Server block: the one profile selector, the state of the installation, and the first-profile action -->
      <div class="sidebar-server">
        <label class="sidebar-profile" for="global-profile">
          <span>Server</span>
          <select id="global-profile" disabled><option>Loading profiles…</option></select>
        </label>
        <p class="status-label sidebar-server-state status-neutral" id="sidebar-server-state">Checking…</p>
        <p class="sidebar-running" id="sidebar-running" hidden></p>
        <button class="button sidebar-create" id="sidebar-create-profile" type="button" hidden>Create profile</button>
      </div>
      <!-- Navigation: groups and items are built from the section registry at start -->
      <nav class="nav-list" aria-label="Sections"></nav>
      <div class="sidebar-foot" id="application-status" role="status" aria-live="polite" aria-atomic="true">
        <span class="status-dot is-busy" aria-hidden="true"></span>
        <span class="sidebar-status-copy"><strong>Application status</strong><small id="application-status-text">Connecting…</small></span>
      </div>
    </aside>

    <!-- Workspace: page heading and live content region -->
    <div class="workspace">
      <!-- Operation bar: stays above the page while an operation runs or a result waits -->
      <section class="operation-bar" id="operation-bar" aria-label="Current operation" hidden></section>
      <main id="main-content" tabindex="-1">
        <div class="page-heading">
          <button class="menu-button" id="menu-button" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation">
            <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            <span class="status-dot" id="menu-status-dot" aria-hidden="true" hidden></span>
          </button>
          <div class="page-heading-copy">
            <h1 id="page-title">Overview</h1>
            <p class="page-server" id="page-server" hidden></p>
            <p id="page-description">Server state, updates, backups and the daily schedule.</p>
          </div>
          <!-- Narrow windows: the update badge of the closed sidebar, as a button that opens Mods -->
          <button class="page-update-badge" id="page-update-badge" type="button" hidden>
            <span class="nav-badge" aria-hidden="true"></span>
          </button>
        </div>

        <section class="content-region" id="content-region" aria-live="polite" aria-busy="true">
          <!-- Loading skeleton replaced once the first snapshot arrives -->
          <div class="panel skeleton-panel">
            <div class="panel-heading">
              <div><span class="section-label">Local manager</span><h2>Loading workspace</h2></div>
            </div>
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton-grid" aria-hidden="true">
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
              <div class="skeleton skeleton-card"></div>
            </div>
            <span class="sr-only">Loading the application state.</span>
          </div>
        </section>
      </main>
    </div>
  </div>
  <!-- Scrim shown behind the open mobile sidebar drawer -->
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
  <!-- Operation announcements for assistive technology; modal dialogs leave these two elements active -->
  <div class="sr-only" id="operation-announcer" role="status" data-announcer></div>
  <div class="sr-only" id="operation-alert" role="alert" data-announcer></div>
  <!-- Reason text that every busy-locked control refers to -->
  <span id="busy-reason" hidden></span>
  <!-- INLINE_SCRIPT -->
</body>
</html>
