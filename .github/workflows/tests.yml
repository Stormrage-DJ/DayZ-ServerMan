name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and static tests
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned packages
        run: python -m pip install -r runnable/requirements.txt
      - name: Install the development tools
        # tests/test_undefined_names.py needs pyflakes and fails in CI without it
        run: python -m pip install -r requirements-dev.txt
      - name: Compile-check the Python source
        run: python -m compileall -q runnable/src/python
      - name: Run the riskiest tests that do not start Microsoft Edge
        shell: pwsh
        # tests/ci_unit.txt lists the tests that CI runs; tests/ci_risk.py writes it.
        # tests.ci_run runs them on four processes, then prints each failure and the
        # counts as annotations, which the public API serves without the job log.
        run: |
          $env:PYTHONPATH = (Resolve-Path .\runnable\src\python).Path
          python -m tests.ci_run --label=Unit --jobs=4 --select=tests/ci_unit.txt
